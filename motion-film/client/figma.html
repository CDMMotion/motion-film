<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mótion Figma Layers</title>
    <link rel="stylesheet" href="styles.css?v=0110a" />
    <link rel="stylesheet" href="figma.css?v=0110a" />
  </head>
  <body>
    <!-- Structural clone of layers.html (same shell, same #paint-keepalive
         canvas, same status toast). This window also hosts the local
         HTTP server the Figma plugin talks to (see figma.js), so it has to
         stay open for the bridge to work. -->
    <div class="app-shell">
      <canvas id="paint-keepalive" width="8" height="8" aria-hidden="true"></canvas>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <div class="mfl-main">
        <div class="mfl-actions">
          <button id="mfl-layers" class="footer-button mfl-button" type="button" title="Importar camadas: o frame selecionado no Figma vira uma composição com cada camada separada, na mesma posição, com formas e textos editáveis. Itens soltos (fora de frame) entram na comp ativa.">
            <svg viewBox="0 0 28 28" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
              <path d="M14 4 3.5 9.5 14 15l10.5-5.5z"/>
              <path d="m3.5 14 10.5 5.5L24.5 14"/>
              <path d="m3.5 18.5 10.5 5.5 10.5-5.5"/>
            </svg>
            <span>Camadas</span>
          </button>
          <button id="mfl-raster" class="footer-button mfl-button" type="button" title="Rasterizar seleção: cada item selecionado no Figma vira um PNG (grupos inteiros achatados numa imagem), na comp ativa.">
            <svg viewBox="0 0 28 28" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
              <rect x="4" y="5" width="20" height="18" rx="2.5"/>
              <circle cx="10" cy="11" r="2"/>
              <path d="m4.5 20 6-6 4 4 3-3 6 6"/>
            </svg>
            <span>Rasterizar</span>
          </button>
          <button id="mfl-comp" class="footer-button mfl-button" type="button" title="Criar composição: cada frame selecionado no Figma vira uma composição vazia no After Effects, com o mesmo nome e o mesmo tamanho em pixels.">
            <svg viewBox="0 0 28 28" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
              <rect x="4.5" y="6.5" width="19" height="15" rx="2"/>
              <path d="M8.5 6.5v15M19.5 6.5v15M4.5 11h4M4.5 17h4M19.5 11h4M19.5 17h4"/>
            </svg>
            <span>Comp</span>
          </button>
        </div>

        <div class="mfl-row">
          <span class="mfl-label">PNG</span>
          <div class="mfl-seg" id="mfl-scale">
            <button type="button" data-v="1">1x</button>
            <button type="button" data-v="2">2x</button>
            <button type="button" data-v="3">3x</button>
            <button type="button" data-v="4">4x</button>
          </div>
        </div>

        <div id="mfl-conn" class="mfl-conn" title="">
          <span class="mfl-dot"></span>
          <span id="mfl-conn-text">Iniciando…</span>
        </div>
      </div>
    </div>
    <!-- ?v bumped on every figma.js/shared-core.js change (CEF Code Cache,
         same note as index.html). -->
    <script src="shared-core.js?v=0110a"></script>
    <script src="figma.js?v=0110a"></script>
  </body>
</html>
